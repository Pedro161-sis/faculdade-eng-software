<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgroTech Solutions</title>

    <link rel="stylesheet" href="aula2.css">
</head>

<body>

    <header>

        <nav class="navbar">

            <div class="logo">
                AgroTech
            </div>

            <ul class="nav-links">

                <li>
                    <a href="#home">Home</a>
                </li>

                <li>
                    <a href="#services">Services</a>
                </li>

                <li>
                    <a href="#contact">Contact</a>
                </li>

            </ul>

            <div class="burger">

                <div class="line1"></div>

                <div class="line2"></div>

                <div class="line3"></div>

            </div>

        </nav>

    </header>

    <section id="contact">

        <h2>Contact Us</h2>

        <form class="contact-form">

            <label for="name">Name:</label>

            <input
                type="text"
                id="name"
                name="name"
                required
            >

            <label for="email">Email:</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="message">Message:</label>

            <textarea
                id="message"
                name="message"
                rows="4"
                required
            ></textarea>

            <button type="submit">
                Submit
            </button>

        </form>

    </section>

    <script src="aula2.js"></script>

</body>
</html>
