<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Loja - E-commerce</title>
    <link rel="stylesheet" href="aula5.css">
</head>
<body>
    <header>
        <h1>Bem-vindo à Nossa Loja</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Produtos</a>
            <a href="#">Sobre Nós</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <main>
        <section class="promo">
            <h2>Promoções de Verão</h2>
            <p>Aproveite os descontos incríveis!</p>
        </section>

        <section class="produtos-section">
            <h2>Produtos em Destaque</h2>
            <div class="grid-produtos">
                <div class="produto-card">
                    <img src="ecommerce1.png" alt="Produto 1">
                </div>
                <div class="produto-card">
                    <img src="ecommerce2.png" alt="Produto 2">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
