<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante XYZ</title>
    <link rel="stylesheet" href="aula1.css">
</head>
<body>

<header>
    <h1>Restaurante XYZ</h1>
</header>

<main>

    <section>
        <h2>Nosso Menu</h2>

        <div class="grid-menu">
            <div class="item">Prato 1</div>
            <div class="item">Prato 2</div>
            <div class="item">Prato 3</div>
            <div class="item">Prato 4</div>
        </div>
    </section>

    <section class="contato">
        <h2>Contato</h2>
        <p>Telefone: (123) 456-7890</p>
        <p>Endereço: Rua Exemplo, 123</p>
    </section>

    <section>
        <h2>Galeria de Fotos</h2>

        <div class="grid-galeria">
            <div class="foto">Foto 1</div>
            <div class="foto">Foto 2</div>
            <div class="foto">Foto 3</div>
            <div class="foto">Foto 4</div>
        </div>
    </section>

</main>

<footer>
    <p>© 2024 Restaurante XYZ</p>
</footer>

</body>
</html>
