<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Layout Responsivo Bootstrap</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <!-- HEADER -->
  <header class="container-fluid bg-dark text-white text-center p-4 shadow">
    <h1>Meu Site Responsivo</h1>
  </header>

  <!-- MAIN -->
  <main class="container my-5">

    <div class="row g-4">

      <!-- COLUNA 1 -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="bg-primary text-white p-4 rounded shadow text-center h-100">
          <h2>Coluna 1</h2>
          <p>
            Exemplo de layout responsivo utilizando Bootstrap 5.
          </p>
        </div>
      </div>

      <!-- COLUNA 2 -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="bg-success text-white p-4 rounded shadow text-center h-100">
          <h2>Coluna 2</h2>
          <p>
            As colunas se ajustam automaticamente conforme a tela.
          </p>
        </div>
      </div>

      <!-- COLUNA 3 -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="bg-warning p-4 rounded shadow text-center h-100">
          <h2>Coluna 3</h2>
          <p>
            O Bootstrap facilita o desenvolvimento de interfaces modernas.
          </p>
        </div>
      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-dark text-white text-center p-3 mt-5">
    Desenvolvido com Bootstrap 5
  </footer>

</body>
</html>
